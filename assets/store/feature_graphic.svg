    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F7F9EE"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="500" fill="url(#page)"/>
  <circle cx="964" cy="-25" r="178" fill="#DCEBCB" opacity=".75"/>
