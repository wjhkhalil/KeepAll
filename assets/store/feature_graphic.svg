  <text x="72" y="325" fill="#62776D" font-family="Nunito, Arial, sans-serif" font-size="21" font-weight="600">Tasks, reminders, lists, receipts and documents —</text>
  <text x="72" y="354" fill="#62776D" font-family="Nunito, Arial, sans-serif" font-size="21" font-weight="600">all calmly kept in one place.</text>

